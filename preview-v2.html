<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#F5F3F0;--card:#fff;--ink:#1A1A1A;--muted:#6B6B6B;--faint:#9A9A9A;
  --accent:#0D8F6E;--accent-h:#0A7A5C;--accent-l:rgba(13,143,110,.08);
  --border:#E0DDD8;--soft:#F0EDE8;--danger:#C0392B;
  --bk:#C0392B;--pp:#2B7BB5;--shu:#6FAA3D;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sys);line-height:1.55;-webkit-font-smoothing:antialiased;padding-top:var(--st)}
a{color:var(--accent);text-decoration:none}
input,select,textarea,button{font-family:var(--sys)}

#view{max-width:680px;margin:0 auto;padding:14px 16px calc(76px + var(--sb));min-height:100vh}
#view.atlas-view{max-width:none;padding:0;min-height:100vh}
.city-switch{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.city-switch::-webkit-scrollbar{display:none}
.cs{flex-shrink:0;border:1px solid var(--border);background:var(--card);border-radius:980px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.cs.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cs.locked{opacity:.6}

.subbar{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.back{border:1px solid var(--border);background:var(--card);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
.subbar .stitle{font-size:16px;font-weight:700}

.shead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:22px 0 11px}
.shead::before{content:"";width:15px;height:2px;background:var(--accent);border-radius:2px}

.photo{border-radius:16px;background:#c5d4b3;box-shadow:var(--shadow);position:relative;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.photo .cap{position:absolute;left:12px;bottom:11px;background:rgba(255,255,255,.9);font-size:11px;font-weight:600;color:var(--muted);padding:4px 11px;border-radius:980px}
.otitle{padding:14px 2px 2px}
.otitle .k{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.16em;text-transform:uppercase}
.otitle h1{font-size:27px;font-weight:700;margin-top:5px}
.otitle .d{font-size:13.5px;color:var(--muted);margin-top:4px}
.intro{font-size:13.5px;color:var(--muted);margin:9px 2px 0;line-height:1.7}
.intro .zh{color:var(--ink);margin-top:5px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fact{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.fact .l{font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.fact .v{font-size:14px;font-weight:600;line-height:1.4}
.fact .v small{font-weight:400;color:var(--muted);font-size:12px}

.legend{display:flex;gap:7px;flex-wrap:wrap}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:980px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.tchip .d{width:8px;height:8px;border-radius:50%}

.daycard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.daycard:active{transform:scale(.99)}
.daycard .dt{font-size:12px;color:var(--accent);font-weight:700}
.daycard h3{font-size:17px;font-weight:700;margin-top:5px}
.daycard .sm{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.daycard .dmeta{font-size:12px;color:var(--faint);margin-top:7px}
.daycard .arr{color:var(--faint);font-size:13px;margin-top:8px}

.mapslot{height:30vh;min-height:210px;border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px}
#mapHost{display:none;height:100%;width:100%}

.timeline{position:relative;padding-left:23px;margin-top:8px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:11px}
.tl-dot{position:absolute;left:-21px;top:17px;width:10px;height:10px;border-radius:50%;z-index:2;box-shadow:0 0 0 3px var(--bg)}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.card-main{padding:13px 16px 11px;cursor:pointer}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.time{font-size:12px;font-weight:700;color:var(--faint)}
.tbadge{font-size:11px;font-weight:600;color:var(--muted);background:var(--soft);padding:2px 9px;border-radius:6px}
.name{font-size:16.5px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:3px}
.note{font-size:13.5px;color:var(--muted);line-height:1.6}
.tag{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.BK{background:rgba(192,57,43,.1);color:var(--bk)}
.tag.PP{background:rgba(43,123,181,.1);color:var(--pp)}
.tag.shu{background:rgba(111,170,61,.14);color:#4f8a26}
.exp{font-size:12px;color:var(--accent);font-weight:600;margin-top:7px}
.detail{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:12.5px;color:var(--muted)}
.detail.open{max-height:280px}
.detail-in{padding:2px 16px 11px;border-top:1px solid var(--border);margin-top:8px}
.detail .row{margin-top:6px}.detail .row b{color:var(--ink);font-weight:600}
.detail .tp{margin-top:7px;color:var(--accent)}
.card-ft{padding:12px 16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:11px;border-top:1px dashed var(--border)}
.btn-gmap{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:9px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600}
.nlbl{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;margin-bottom:5px}
.ta{width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;resize:vertical;min-height:40px;background:var(--bg);color:var(--ink)}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.notebox{width:100%}
.saved{font-size:11px;color:var(--accent);height:13px}

.pl{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
.pl .pn{font-size:16px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.pl .pmeta{font-size:12.5px;color:var(--muted);margin-top:3px}
.pl .pnote{font-size:12px;color:var(--accent);background:var(--accent-l);padding:5px 9px;border-radius:7px;margin-top:6px;line-height:1.5}
.thoughts{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}

.cmcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.cmcard .cmtop{height:118px;background-size:cover;background-position:center}
.cmcard .cmin{padding:13px 16px}
.cmcard h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.cmcard .cmsm{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.epigraph{text-align:center;padding:18px 22px 4px;color:var(--muted);font-style:italic;line-height:1.9;font-size:14.5px}
.epigraph .epi-em{display:block;margin-top:7px;color:var(--ink)}
.epi-zh{font-style:normal;font-size:12.5px;color:var(--muted);margin-top:12px;letter-spacing:.02em}

.spend-total{background:linear-gradient(135deg,#0D8F6E,#0A7A5C);color:#fff;border-radius:16px;padding:17px 20px;box-shadow:var(--shadow)}
.spend-total .l{font-size:12px;opacity:.85;letter-spacing:.06em}
.spend-total .v{font-size:30px;font-weight:700;margin-top:4px}
.spend-total .v small{font-size:14px;font-weight:500;opacity:.9}
.spend-total .sub{font-size:12px;opacity:.85;margin-top:6px}
.ratebox{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-top:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ratebox input{width:64px;border:1px solid var(--border);border-radius:7px;padding:5px 7px;font-size:12.5px;background:var(--bg);color:var(--ink)}
.sform{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 14px;margin-top:11px;box-shadow:var(--shadow)}
.sform .r{display:flex;gap:8px;flex-wrap:wrap}
.sform select,.sform input{border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:13.5px;background:var(--bg);color:var(--ink)}
.sform .c-day{width:96px}.sform .c-cat{width:108px}.sform .c-item{flex:1;min-width:130px}.sform .c-amt{width:92px}
.sform button{width:100%;margin-top:9px;padding:10px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.scats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.scat{font-size:11.5px;background:var(--soft);border:1px solid var(--border);padding:4px 10px;border-radius:980px;color:var(--muted)}
.scat b{color:var(--ink)}
.sgroup{margin-top:16px}
.sgroup .gh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:3px 0}
.sgroup .gh .gleft{display:flex;align-items:center;gap:7px}
.caret{display:inline-block;width:12px;color:var(--faint);font-size:11px}
.sgroup.folded .srows{display:none}
.foldrow{display:flex;justify-content:flex-end;margin-top:14px}
.foldall{border:none;background:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-top:8px;box-shadow:var(--shadow)}
.srow .ico{font-size:17px}
.srow .info{flex:1;min-width:0}
.srow .it{font-size:14px;font-weight:600}
.srow .ic{font-size:11.5px;color:var(--faint)}
.srow .am{font-size:15px;font-weight:700;white-space:nowrap}
.srow .am small{font-size:11px;color:var(--faint);font-weight:500;display:block;text-align:right}
.srow .del{border:none;background:none;color:var(--faint);font-size:16px;cursor:pointer;padding:4px}
.srow .del:active{color:var(--danger)}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:26px 10px}
.backup{margin-top:18px;display:flex;gap:8px}
.backup button{flex:1;padding:10px;border:1px solid var(--border);background:var(--card);border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.footnote{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:22px;padding:0 4px;text-align:center}

.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(60px + var(--sb));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:var(--sb)}
.tb{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
.tb .i{font-size:20px;line-height:1}
.tb.active{color:var(--accent)}

.leaflet-popup-content-wrapper{border-radius:11px!important;box-shadow:var(--shadow)!important;border:1px solid var(--border)}
.leaflet-popup-content{font-size:12.5px!important;margin:9px 11px!important;line-height:1.5!important}
.leaflet-popup-content a{color:var(--accent)!important;font-weight:600}
.leaflet-control-zoom{border-radius:9px!important;overflow:hidden;box-shadow:var(--shadow)!important;border:1px solid var(--border)!important}
.leaflet-control-zoom a{background:rgba(255,255,255,.94)!important;color:var(--ink)!important}
.leaflet-control-attribution{font-size:8px!important;opacity:.4}

/* ═══════ Travel Journal V2 ═══════ */
:root{--bg:#F7F6F2;--ink:#3F4541;--muted:#73736D;--faint:#999892;--accent:#D97757;--accent-h:#BD6246;--accent-l:#F8ECE7;--border:#DEDCD5;--soft:#F3F0EB;--shadow:0 5px 22px rgba(67,64,57,.055)}
body{background:var(--bg)}
.en-serif{font-family:"Lora",Georgia,serif}
.atlas{max-width:760px;margin:0 auto;padding:16px 16px 50px}
.atlas-brand{display:flex;align-items:center;justify-content:space-between;padding:7px 2px 19px}
.atlas-logo{display:flex;align-items:center;gap:9px;font-family:"Lora",Georgia,serif;font-size:20px;font-weight:600}
.atlas-logo svg{color:var(--accent)}
.atlas-brand small{color:var(--muted);font-size:11px}
.atlas-hero{display:grid;grid-template-columns:1fr 220px;align-items:center;gap:22px;min-height:260px;padding:25px 27px;background:var(--card);border:1px solid var(--border);border-radius:22px}
.atlas-hero h1{font-size:31px;line-height:1.22;margin:8px 0 12px}.atlas-hero p{font-size:13.5px;color:var(--muted)}
.atlas-art{height:190px;position:relative;display:grid;place-items:center}.atlas-sun{width:145px;height:145px;border-radius:50%;background:#F4E3DC}.atlas-route{position:absolute;width:158px;height:170px;border:6px solid var(--ink);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(23deg)}
.atlas-route:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);top:24px;left:1px;box-shadow:39px 31px 0 var(--accent),80px 14px 0 var(--accent),104px 59px 0 var(--accent)}
.atlas-kicker{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.next-trip{margin-top:12px;background:#F8ECE7;border:1px solid #ECD9D1;border-radius:17px;padding:17px 19px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.next-trip small{display:block;color:#8C6B60;font-size:10.5px;letter-spacing:.1em}.next-trip b{font-size:17px}.next-trip .arr2{font-size:20px;color:#8C6B60}
.atlas-head{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 12px}.atlas-head h2{font-size:21px;margin:0}.atlas-head span{font-size:11px;color:var(--muted)}
.atlas-cities{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.atlas-city{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}.atlas-city-photo{height:126px;background-position:center;background-size:cover}.atlas-city-in{padding:13px 14px}.atlas-city h3{font-size:18px;margin:0}.atlas-city .status{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:99px;background:var(--accent-l);color:#8A5949;font-size:10.5px}
.trip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.journal-home{border:0;background:none;color:var(--muted);font-size:12px;padding:5px 0;cursor:pointer}.journal-home svg{vertical-align:-3px;margin-right:4px;color:var(--accent)}
.city-picker{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 29px 7px 10px;font-size:13px;font-weight:600;max-width:145px;cursor:pointer}
.cs.active,.tb.active{background:transparent;color:var(--accent)}.cs.active{background:#F4E4DE;color:#6F5148;border-color:#EAD3CA}.btn-gmap,.sform button{background:var(--accent)}.spend-total{background:linear-gradient(135deg,#D9876D,#C96E53)}
.list-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.list-kind{border:1px solid var(--border);background:var(--card);border-radius:13px;padding:12px;cursor:pointer}.list-kind.active{background:#F4E4DE;border-color:#EAD3CA}.list-kind .li{font-size:20px}.list-kind b{display:block;font-size:13px;margin-top:4px}.list-kind small{color:var(--muted);font-size:10.5px}.list-add{display:flex;gap:7px;margin:13px 0}.list-add input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--card);font-size:13px}.list-add button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:0 14px;font-weight:700}.check-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-top:8px}.check-row input{width:18px;height:18px;accent-color:var(--accent)}.check-row.done .check-text{text-decoration:line-through;color:var(--faint)}.check-text{flex:1;font-size:13.5px}.check-del{border:0;background:none;color:var(--faint);font-size:15px}.list-empty{text-align:center;color:var(--faint);font-size:12.5px;padding:30px}
.atlas-hero h1,.atlas-head h2,.atlas-city h3,.next-trip b,.otitle h1{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:500;color:#5D5558}.next-trip{background:#F4EEF1;border-color:#EADDE3}.next-trip small{color:#846B78}.next-trip b{font-size:17px;letter-spacing:.02em}.next-trip .arr2{color:#A78394}
@media(max-width:600px){.atlas{padding:10px 14px 35px}.atlas-brand{padding-bottom:10px}.atlas-brand small{font-size:10.5px}.atlas-hero{display:flex;flex-direction:column-reverse;align-items:stretch;min-height:0;padding:20px}.atlas-art{height:150px;transform:scale(.78);margin:-20px}.atlas-hero h1{font-size:28px}.atlas-cities{grid-template-columns:1fr}.atlas-city-photo{height:135px}.list-summary{gap:6px}.list-kind{padding:10px 8px}}
</style>
</head>

<main id="view"></main>
<div id="mapHost"><div id="map" style="height:100%;width:100%"></div></div>
<nav class="tabbar" id="tabbar">
  <button class="tb active" data-tab="overview"><span class="i">📋</span>总览</button>
  <button class="tb" data-tab="itinerary"><span class="i">🗓️</span>行程</button>

<script>
/* ═══════ 币种与汇率（rate = 1 本币兑多少 CNY，参考值，可改） ═══════ */
const CUR={THB:{sym:'฿',rate:0.205},JPY:{sym:'¥',rate:0.048},KRW:{sym:'₩',rate:0.0052}};
function getRate(code){const v=parseFloat(localStorage.getItem('rate:'+code));return v?v:CUR[code].rate}

/* ═══════ 地点库（id 唯一；行程与地图共享，备注互通） ═══════ */
const P={

const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const state={mode:'atlas',city:'chiangmai',tab:'overview',sub:null,listKind:'packing'};
function cid(){return state.city}
function nk(id){return 'note:'+cid()+':'+id}
function getNote(id){return localStorage.getItem(nk(id))||''}
function getThought(city){return localStorage.getItem('thought:'+city)||''}
function getSpend(){const v=LS.get('spend:'+cid(),[]);return Array.isArray(v)?v:[]}
function setSpend(a){LS.set('spend:'+cid(),a)}

function getLists(){const key='lists:'+cid(),saved=LS.get(key,null);if(saved)return saved;const data={};Object.keys(LIST_META).forEach(k=>data[k]=LIST_DEFAULT[k].map((text,i)=>({id:k+i,text,done:false})));LS.set(key,data);return data}
function setLists(data){LS.set('lists:'+cid(),data)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function grandCNY(){let g=0;for(const k in CITIES){const c=CITIES[k],raw=LS.get('spend:'+k,[]),list=Array.isArray(raw)?raw:[];const t=list.reduce((s,x)=>s+(+x.amount||0),0);g+=t*getRate(c.code)}return g}

let map=null;const mapHost=document.getElementById('mapHost');let markers=[],polys=[];
function ensureMap(){if(map)return;map=L.map(mapHost.querySelector('#map'),{center:[18.79,98.98],zoom:13,zoomControl:false,attributionControl:true});L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OSM, © CARTO'}).addTo(map)}
function icn(c,e,num){const inner=num?`<b style="font-size:12px">${num}</b>`:`<span style="font-size:11px">${e||''}</span>`;return L.divIcon({className:'',html:`<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg)">${inner}</span></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]})}
function locColor(l){return l.tags&&l.tags.length?(TAGCOL[l.tags[0]]||'#8a8a8a'):(TYPE[l.type]?TYPE[l.type].c:'#8a8a8a')}
function clearMap(){markers.forEach(m=>map.removeLayer(m));polys.forEach(p=>map.removeLayer(p));markers=[];polys=[]}
function gmapUrl(l){const c=CITIES[state.sub]||CITIES[cid()]||{};return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.googleQuery||`${l.name} ${c.name||''} ${c.en||''}`)}`}
function plotSeq(locs,fit,numbered){clearMap();const co=[];let n=0;locs.forEach(l=>{if(!l.lat)return;const main=l.time&&l.time!=='—';if(main)n++;const m=L.marker([l.lat,l.lng],{icon:icn(locColor(l),TYPE[l.type]?.e,numbered&&main?n:null)}).addTo(map);m.bindPopup(`<b>${l.name}</b><br><span style="color:#6B6B6B">${numbered&&main?'第'+n+'站 · ':''}${l.note||''}</span><br><a href="${gmapUrl(l)}" target="_blank">📍 Google Maps</a>`);markers.push(m);if(main)co.push([l.lat,l.lng])});if(co.length>1)polys.push(L.polyline(co,{color:'#0D8F6E',weight:2.4,opacity:.5,dashArray:'5,7'}).addTo(map));if(fit){const all=locs.filter(l=>l.lat).map(l=>[l.lat,l.lng]);if(all.length)map.fitBounds(all,{padding:[40,40],maxZoom:14})}else{map.setView([18.795,98.985],12)}}
function mountMap(slotSel,locArr,fit,numbered){const slot=document.querySelector(slotSel);if(!slot)return;slot.appendChild(mapHost);mapHost.style.display='block';ensureMap();const go=()=>{map.invalidateSize();plotSeq(locArr,fit,numbered)};requestAnimationFrame(()=>requestAnimationFrame(go));setTimeout(go,300)}

     ${l.hours?`<div class="row"><b>营业</b>　${l.hours}</div>`:''}
     ${l.price?`<div class="row"><b>人均/门票</b>　${l.price}</div>`:''}
     ${l.tips?`<div class="tp">💡 ${l.tips}</div>`:''}
   </div></div>
   <div class="card-ft"><a class="btn-gmap" href="${gmapUrl(l)}" target="_blank" rel="noopener">📍 Google Maps</a>${noteBox(l.id)}</div>
   </div></div>`;
}
function toggle(uid){const d=document.getElementById(uid),h=document.getElementById('h-'+uid);if(!d)return;const o=d.classList.toggle('open');if(h)h.innerHTML=o?'收起 ▴':'展开详情 ▾'}
window.toggle=toggle;

/* ═══════ 渲染 ═══════ */
const view=document.getElementById('view');
function render(){
  const tabbar=document.getElementById('tabbar');
  view.classList.toggle('atlas-view',state.mode==='atlas');
  if(state.mode==='atlas'){tabbar.style.display='none';view.innerHTML=renderAtlas();window.scrollTo({top:0});return}
  tabbar.style.display='flex';
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='overview')view.innerHTML=renderOverview();
  else if(state.tab==='itinerary')view.innerHTML=state.sub?renderItinDay():renderItinList();
  else if(state.tab==='map')view.innerHTML=state.sub?renderMapCity():renderMapCities();
  else if(state.tab==='list')view.innerHTML=renderList();
  else if(state.tab==='spend'){view.innerHTML=renderSpend();wireSpend()}
  window.scrollTo({top:0});
  if(state.tab==='itinerary'&&state.sub){const d=CITIES[cid()].days.find(x=>x.id===state.sub);mountMap('#mmap',d.locations,true,true)}
  if(state.tab==='map'&&state.sub){mountMap('#cmap',CITIES[state.sub].places,false,false)}
}
function journalMark(){return `<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M19.8 4.2 4.2 19.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`}
function renderAtlas(){
  const available=Object.entries(CITIES).filter(([,c])=>!c.placeholder),planned=Object.entries(CITIES).filter(([,c])=>c.placeholder);
  return `<div class="atlas"><div class="atlas-brand"><div class="atlas-logo">${journalMark()} Travel Journal</div><small>个人旅行档案</small></div>
  <section class="atlas-hero"><div><div class="atlas-kicker en-serif">MY LITTLE JOURNEYS</div><h1>去看看世界，<br>也收藏生活。</h1><p>把每一次出发、每一座城市和偶然遇见的好地方，慢慢整理成自己的旅行地图。</p></div><div class="atlas-art"><div class="atlas-sun"></div><div class="atlas-route"></div></div></section>
  <div class="next-trip" data-open-city="chiangmai"><div><small class="en-serif">NEXT JOURNEY · 09.25</small><b>清迈国庆慢游</b><div class="meta">2026.09.25 — 09.30 · 5 天</div></div><span class="arr2">→</span></div>
  <div class="atlas-head"><h2>城市档案</h2><span>${available.length} CITY · ${planned.length} PLANNED</span></div>
  <div class="atlas-cities">${Object.entries(CITIES).map(([k,c])=>`<article class="atlas-city" data-open-city="${k}"><div class="atlas-city-photo" style="background:${c.placeholder?'linear-gradient(135deg,#F1DFD8,#E5E8DC)':`linear-gradient(0deg,rgba(0,0,0,.08),transparent),url('${c.photo}') center/cover`}"></div><div class="atlas-city-in"><h3>${c.name} <span class="en-serif" style="font-weight:400">${c.en}</span></h3><div class="meta">${c.placeholder?'待规划':'收藏 '+c.places.length+' 个地点 · 1 次 Trip'}</div><span class="status">${c.placeholder?'想去':'计划中'}</span></div></article>`).join('')}</div></div>`;
}
function tripHome(){return `<div class="trip-top"><button class="journal-home" data-atlas>${journalMark()} 返回旅行地图册</button><select class="city-picker" id="city-picker" aria-label="切换城市">${Object.entries(CITIES).map(([k,c])=>`<option value="${k}" ${k===cid()?'selected':''}>${c.emoji} ${c.name}${c.placeholder?' · 待规划':''}</option>`).join('')}</select></div>`}
function citySwitch(){return tripHome()}
function renderOverview(){
  const c=CITIES[cid()];
  if(c.placeholder)return citySwitch()+`<div class="empty">「${c.name}」还在规划中 📝<br>结构已就绪，随时可加入行程与地点。</div>`;
  const cnt={BK:0,PP:0,shu:0};c.days.forEach(d=>d.locations.forEach(l=>(l.tags||[]).forEach(t=>cnt[t]++)));
  return citySwitch()+
  `<div class="photo"><img src="${c.photo}" alt="${c.name}" onerror="this.style.display='none'"><div class="cap">${c.emoji} ${c.en}</div></div>
  <div class="otitle"><div class="k">${c.en} · Slow Travel</div><h1>${c.name} · 慢游五日</h1><div class="d">${c.dates}</div></div>
  <div class="intro"><div>${c.intro.en}</div><div class="zh">${c.intro.zh}</div></div>
  <div class="shead">行程速览</div>
  <div class="facts">${c.facts.map(f=>`<div class="fact"><div class="l">${f[0]}</div><div class="v">${f[1]}<br><small>${f[2]}</small></div></div>`).join('')}</div>
  <div class="shead">每日概览</div>
  ${c.days.map(d=>`<div class="daycard" data-go="itin:${d.id}"><div class="dt">${c.name} · ${d.label} ${d.date} ${d.wd}</div><h3>${d.title}</h3><div class="sm">${d.sm}</div><div class="arr">查看当日行程 ›</div></div>`).join('')}
  <div class="shead">打卡标签</div>
  <div class="legend">
    <span class="tchip"><span class="d" style="background:var(--bk)"></span>🔴 BK · ${cnt.BK}</span>
    <span class="tchip"><span class="d" style="background:var(--pp)"></span>🔵 PP · ${cnt.PP}</span>
    <span class="tchip"><span class="d" style="background:var(--shu)"></span>🟢 舒华 · ${cnt.shu}</span>
  </div>
  <div class="footnote">行程仅供参考，按实际体力/天气灵活调整。<br>📍 Google Maps 按钮按店名搜索，可准确到达；个别小店地图标记为估算，出发前可复核。</div>`;
}
function renderItinList(){
  const c=CITIES[cid()];
  if(c.placeholder)return citySwitch()+`<div class="empty">${c.name} 行程待规划</div>`;
  return citySwitch()+`<div class="shead">每日行程 · ${c.name}</div>`+
  c.days.map(d=>{const main=d.locations.filter(x=>x.time&&x.time!=='—').length;const alt=d.locations.length-main;return `<div class="daycard" data-go="itin:${d.id}"><div class="dt">${c.name} · ${d.label} ${d.date} ${d.wd}</div><h3>${d.title}</h3><div class="sm">${d.sm}</div><div class="dmeta">📍 ${main} 个主要地点${alt?`　·　+${alt} 个备选`:''}</div><div class="arr">查看详情 ›</div></div>`}).join('');
}
function renderItinDay(){
  const c=CITIES[cid()],d=c.days.find(x=>x.id===state.sub);
  const main=d.locations.filter(l=>l.time&&l.time!=='—'),alt=d.locations.filter(l=>!l.time||l.time==='—');
  return `<div class="subbar"><button class="back" data-back="1">‹</button><div class="stitle">${c.name} · ${d.label} ${d.date} ${d.wd} · ${d.title}</div></div>
  <div class="mapslot" id="mmap"></div>
  <div class="timeline">${main.map(dayCardHTML).join('')}</div>
  ${alt.length?`<div class="shead">备选</div><div class="timeline">${alt.map(dayCardHTML).join('')}</div>`:''}`;
}
function renderMapCities(){
  return tripHome()+`<div class="epigraph"><p>We don't collect cities —<br>we collect the selves we found in them:<br>the slow morning, the wrong turn that became the best coffee,<br>the sunset we almost missed.<span class="epi-em">A map is only the trail of who we were becoming.</span></p><div class="epi-zh">一张地图，记下的是我们一路成为的样子。</div></div>
  <div class="shead">我的收藏 · 按城市</div>`+
  Object.entries(CITIES).map(([k,c])=>`<div class="cmcard" data-go="mapc:${k}"><div class="cmtop" style="background:${c.placeholder?'linear-gradient(135deg,#e0d8c8,#efe9da)':`url('${c.photo}') center/cover`}"></div><div class="cmin"><h3>${c.emoji} ${c.name}地图</h3><div class="cmsm">${c.placeholder?'待规划，点进可开始添加':'共 '+c.places.length+' 个收藏地点 · 点查看地图与备注'}</div></div></div>`).join('');
}
function placeCardHTML(p){const n=getNote(p.id);return `<div class="pl"><div class="pn">${TYPE[p.type]?.e||''} ${p.name} ${tagsH(p)}</div><div class="pmeta">${p.note||''}${p.hours?' · '+p.hours:''}${p.price?' · '+p.price:''}</div>${n?`<div class="pnote">📝 ${esc(n)}</div>`:''}<div style="margin-top:10px"><a class="btn-gmap" href="${gmapUrl(p)}" target="_blank" rel="noopener">📍 Google Maps</a></div></div>`}
function renderMapCity(){
  const c=CITIES[state.sub],city=state.sub;
  if(c.placeholder)return `<div class="subbar"><button class="back" data-back="1">‹</button><div class="stitle">${c.emoji} ${c.name}地图</div></div><div class="empty">${c.name} 待规划，暂无收藏地点</div>`;
  const folded=LS.get('mapfold:'+city,false);
  const shown=folded?c.places.slice(0,1):c.places;
  return `<div class="subbar"><button class="back" data-back="1">‹</button><div class="stitle">${c.emoji} ${c.name} · 收藏地点</div></div>
  <div class="mapslot" id="cmap"></div>
  <div style="font-size:12.5px;color:var(--muted);margin:4px 2px 6px">${c.name}共 ${c.places.length} 个收藏 · 点地点开 Google Maps。地点备注请在「行程」填写，这里只读显示。</div>
  <div class="foldrow"><button class="foldall" id="mapfold">${folded?`展开全部 ${c.places.length} 个`:'收起地点列表'}</button></div>
  ${shown.map(placeCardHTML).join('')}
  ${folded&&c.places.length>1?`<div class="empty" style="padding:10px">… 还有 ${c.places.length-1} 个已折叠</div>`:''}
  <div class="thoughts"><div class="nlbl">📝 关于${c.name}的想法 / 备忘</div><textarea class="ta" data-thought="${city}" placeholder="整体感受、待办、下次想去的…">${esc(getThought(city))}</textarea><div class="saved" data-tsv="${city}"></div></div>`;
}
function renderList(){
  const lists=getLists(),kind=state.listKind,items=lists[kind]||[];
  const cards=Object.entries(LIST_META).map(([k,m])=>{const a=lists[k]||[],done=a.filter(x=>x.done).length;return `<button class="list-kind ${k===kind?'active':''}" data-list-kind="${k}"><span class="li">${m.icon}</span><b>${m.name}</b><small>${done} / ${a.length}</small></button>`}).join('');
  return citySwitch()+`<div class="shead">旅行清单 · ${CITIES[cid()].name}</div><div class="list-summary">${cards}</div>
  <div class="list-add"><input id="list-input" placeholder="添加到${LIST_META[kind].name}…"><button id="list-add">＋</button></div>
  <div>${items.length?items.map(x=>`<label class="check-row ${x.done?'done':''}"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><span class="check-text">${esc(x.text)}</span><button class="check-del" type="button" data-check-del="${x.id}" aria-label="删除">✕</button></label>`).join(''):`<div class="list-empty">这个清单还是空的</div>`}</div>`;
}
function renderSpend(){
  const c=CITIES[cid()],code=c.code,C=CUR[code],rate=getRate(code);
  const list=getSpend();
  const total=list.reduce((s,x)=>s+(+x.amount||0),0);
  const cnyV=total*rate;
  const bycat={};list.forEach(x=>bycat[x.cat]=(bycat[x.cat]||0)+(+x.amount||0));
  const days=c.days;const dayOpts=days.length?days.map(d=>`<option value="${d.label}">${d.label} ${d.date}`).join(''):'<option value="通用">通用</option>';
  const order=[...days.map(d=>d.label),'通用',...list.map(x=>x.day).filter((d,i,a)=>d&&!days.some(x=>x.label===d)&&d!=='通用'&&a.indexOf(d)===i)];const groups={};list.forEach(x=>{(groups[x.day]=groups[x.day]||[]).push(x)});
  const F=folded();
  const gh=order.filter(d=>groups[d]).map(d=>{const sub=groups[d].reduce((s,x)=>s+(+x.amount||0),0);const isF=F.includes(d);return `<div class="sgroup ${isF?'folded':''}"><div class="gh" data-fold="${esc(d)}"><span class="gleft"><span class="caret">${isF?'▸':'▾'}</span><span>${esc(d)}</span></span><span>${C.sym}${sub} <small style="color:var(--faint)">≈¥${(sub*rate).toFixed(1)}</small></span></div><div class="srows">${groups[d].map(x=>`<div class="srow"><span class="ico">${esc(x.icon||'✏️')}</span><div class="info"><div class="it">${esc(x.item)}</div><div class="ic">${esc(x.day)} · ${esc(x.cat)}</div></div><div class="am">${C.sym}${+x.amount||0}<small>≈¥${((+x.amount||0)*rate).toFixed(1)}</small></div><button class="del" data-del="${esc(x.id)}" aria-label="删除记录">✕</button></div>`).join('')}</div></div>`}).join('');
  const dayCount=order.filter(d=>groups[d]).length;
  const foldrow=list.length?`<div class="foldrow"><button class="foldall" id="foldall">${F.length>=dayCount&&dayCount>0?'展开全部':'折叠全部'}</button></div>`:'';
  return citySwitch()+
  `<div class="spend-total"><div class="l">${c.emoji} ${c.name} · 总花费（${code}）</div><div class="v">${C.sym}${total} <small>≈ ¥${cnyV.toFixed(1)} CNY</small></div><div class="sub">全部城市合计 ≈ ¥${grandCNY().toFixed(1)} CNY · 共 ${list.length} 笔</div></div>
  <div class="ratebox">参考汇率：1 ${C.sym}（${code}）= <input id="s-rate" inputmode="decimal" value="${rate}"> ¥（CNY，可改）</div>
  <div class="scats">${CATS.map(cc=>bycat[cc[0]]?`<span class="scat">${cc[1]} ${cc[0]} <b>${C.sym}${bycat[cc[0]]}</b></span>`:'').join('')}</div>
  <div class="sform">
    <div class="r">
      <select class="c-day" id="s-day">${dayOpts}</select>
      <select class="c-cat" id="s-cat">${CATS.map(cc=>`<option value="${cc[0]}">${cc[1]} ${cc[0]}`).join('')}</select>
      <input class="c-item" id="s-item" placeholder="项目（如 打抛饭）">
      <input class="c-amt" id="s-amt" type="number" inputmode="decimal" placeholder="金额(${C.sym})">
    </div>
    <button id="s-add">＋ 添加一笔</button>
  </div>
  ${list.length?'':`<div class="empty">还没有记录，添加第一笔吧 ✍️</div>`}
  ${foldrow}
  ${gh}
  <div class="backup"><button id="bk-export">⬇️ 导出备份</button><button id="bk-import">⬆️ 导入备份</button></div>
  <input type="file" id="bk-file" accept="application/json" style="display:none">`;
}
function wireSpend(){
  document.getElementById('s-add').onclick=()=>{
    const day=document.getElementById('s-day').value,cat=document.getElementById('s-cat').value,
      item=document.getElementById('s-item').value.trim(),amt=document.getElementById('s-amt').value;
    if(!item||!amt){alert('请填项目和金额');return}
    const icon=(CATS.find(c=>c[0]===cat)||['','✏️'])[1];
    const a=getSpend();a.push({id:'x'+Date.now(),day,cat,item,amount:+amt,icon});setSpend(a);render();
  };
  document.getElementById('s-rate').onchange=function(){const v=parseFloat(this.value);if(v>0){localStorage.setItem('rate:'+CITIES[cid()].code,v);render()}};
  const fa=document.getElementById('foldall');if(fa)fa.onclick=()=>{const days=[...document.querySelectorAll('[data-fold]')].map(e=>e.dataset.day);LS.set('spendfold:'+cid(),(folded().length>=days.length&&days.length)?[]:days);render()};
  document.getElementById('bk-export').onclick=exportData;
  document.getElementById('bk-import').onclick=()=>document.getElementById('bk-file').click();
  document.getElementById('bk-file').onchange=importData;
}
function exportData(){
  const data={};Object.keys(localStorage).filter(k=>k.startsWith('note:')||k.startsWith('spend:')||k.startsWith('rate:')||k.startsWith('thought:')||k.startsWith('lists:')).forEach(k=>data[k]=localStorage.getItem(k));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trip-backup.json';a.click();
}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||Array.isArray(d)||typeof d!=='object')throw new Error();const allowed=/^(note|spend|rate|thought|lists):/;const entries=Object.entries(d).filter(([k,v])=>allowed.test(k)&&typeof v==='string');if(!entries.length)throw new Error();entries.forEach(([k,v])=>{if(k.startsWith('spend:')&&!Array.isArray(JSON.parse(v)))throw new Error();if(k.startsWith('lists:')){const x=JSON.parse(v);if(!x||typeof x!=='object')throw new Error()}localStorage.setItem(k,v)});alert('导入成功 ✓');render()}catch{alert('文件格式或数据内容不正确')}};r.readAsText(f)}

/* ═══════ 事件 ═══════ */
document.getElementById('tabbar').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;state.mode='trip';state.tab=b.dataset.tab;state.sub=null;render()});
view.addEventListener('click',e=>{
  if(e.target.closest('[data-atlas]')){state.mode='atlas';state.sub=null;render();return}
  const oc=e.target.closest('[data-open-city]');if(oc){state.mode='trip';state.city=oc.dataset.openCity;state.tab='overview';state.sub=null;render();return}
  const sw=e.target.closest('.cs');if(sw){state.city=sw.dataset.city;state.sub=null;render();return}
  const go=e.target.closest('[data-go]');if(go){const[v,a]=go.dataset.go.split(':');if(v==='itin'){state.tab='itinerary';state.sub=a;render();return}if(v==='mapc'){state.tab='map';state.sub=a;render();return}}
  if(e.target.closest('[data-back]')){state.sub=null;render();return}
  const mf=e.target.closest('#mapfold');if(mf){LS.set('mapfold:'+state.sub,!LS.get('mapfold:'+state.sub,false));render();return}
  const fh=e.target.closest('[data-fold]');if(fh){const d=fh.dataset.fold;const F=folded();const i=F.indexOf(d);if(i>=0)F.splice(i,1);else F.push(d);LS.set('spendfold:'+cid(),F);render();return}
  const del=e.target.closest('[data-del]');if(del){setSpend(getSpend().filter(x=>x.id!==del.dataset.del));render();return}
  const lk=e.target.closest('[data-list-kind]');if(lk){state.listKind=lk.dataset.listKind;render();return}
  const add=e.target.closest('#list-add');if(add){addListItem();return}
  const cd=e.target.closest('[data-check-del]');if(cd){const lists=getLists();lists[state.listKind]=lists[state.listKind].filter(x=>x.id!==cd.dataset.checkDel);setLists(lists);render();return}
});
view.addEventListener('change',e=>{if(e.target.id==='city-picker'){state.city=e.target.value;state.tab='overview';state.sub=null;render();return}const cb=e.target.closest('[data-check]');if(!cb)return;const lists=getLists(),item=lists[state.listKind].find(x=>x.id===cb.dataset.check);if(item)item.done=cb.checked;setLists(lists);render()});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='list-input'){e.preventDefault();addListItem()}});
function addListItem(){const input=document.getElementById('list-input');if(!input)return;const text=input.value.trim();if(!text)return;const lists=getLists();lists[state.listKind].push({id:'l'+Date.now(),text,done:false});setLists(lists);render()}
view.addEventListener('input',e=>{
  const th=e.target.closest('[data-thought]');
  if(th){localStorage.setItem('thought:'+th.dataset.thought,th.value);const sv=document.querySelector(`[data-tsv="${th.dataset.thought}"]`);if(sv)sv.textContent='已保存 ✓';clearTimeout(th._t);th._t=setTimeout(()=>{if(sv)sv.textContent=''},1200);return}
  const ta=e.target.closest('[data-note]');if(!ta)return;
  localStorage.setItem(nk(ta.dataset.note),ta.value);
  const sv=document.querySelector(`[data-sv="${ta.dataset.note}"]`);if(sv)sv.textContent='已保存 ✓';
  clearTimeout(ta._t);ta._t=setTimeout(()=>{if(sv)sv.textContent=''},1200);
});
render();
</script>
</body>
</html>
